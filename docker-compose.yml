services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: sight, POSTGRES_PASSWORD: sight, POSTGRES_DB: sightlite}
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/init.sql"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U sight -d sightlite"], interval: 3s, retries: 15}
  backend:
    build: ./backend
    environment: {DATABASE_URL: "postgresql://sight:sight@db:5432/sightlite"}
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes: {pgdata: {}}
